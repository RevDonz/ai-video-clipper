name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: potongin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Lint Python
        run: uv run ruff check src tests

      - name: Test Python
        run: uv run pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test web
        working-directory: web
        env:
          PYTHON_BIN: ${{ github.workspace }}/.venv/bin/python
        run: npm test

      - name: Build web
        working-directory: web
        env:
          PYTHON_BIN: ${{ github.workspace }}/.venv/bin/python
        run: npm run build

      - name: Validate production image
        run: docker build --tag ai-video-clipper:ci-${{ github.sha }} .

      - name: Validate deployment script and Compose config
        env:
          APP_USERNAME: ci-user
          APP_PASSWORD: ci-password
          APP_SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
          JOBS_STORAGE_QUOTA_BYTES: "1000000000"
          JOBS_STORAGE_MIN_FREE_BYTES: "0"
          JOBS_STORAGE_ACTIVE_RESERVE_BYTES: "1000000"
          JOBS_STORAGE_SCAN_MAX_ENTRIES: "1000"
          JOBS_STORAGE_SCAN_MAX_DEPTH: "8"
          JOBS_STORAGE_SCAN_DEADLINE_MS: "30000"
          JOBS_STORAGE_RECHECK_BYTES: "1000000"
          JOBS_STORAGE_RECHECK_INTERVAL_MS: "1000"
        run: |
          bash -n deploy/production.sh
          IMAGE_TAG=ci-${GITHUB_SHA} docker compose -p ai-video-clipper config --quiet

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Configure production SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/potongin_deploy"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/potongin_deploy"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Fetch and deploy verified commit
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/potongin_deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "set -eu; cd /home/probersama/doni/ai-video-clipper-git; git fetch origin '$DEPLOY_SHA'; git checkout --detach '$DEPLOY_SHA'; DEPLOY_SHA='$DEPLOY_SHA' bash deploy/production.sh"
