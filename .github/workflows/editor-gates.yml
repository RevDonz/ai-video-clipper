name: Editor gates (manual)

# Heavy test runs for work branches, so agents do not load the owner's PC.
# Trigger: gh workflow run editor-gates.yml -f ref=<branch> -f suite=full|image|command|e2e|player [-f command='...']
# suite=full: ruff, pytest (Python 3.11), web tests and build, as in CI/CD. The web suites run
# even when the Python suites failed, so one run shows every failure (the job still fails).
# suite=image: the whole pytest inside the production image (pinned FFmpeg/libass toolchain).
# suite=command: one shell command from the repo root inside the production image; whatever it
# writes to /out is uploaded as the run's artifact.
# suite=e2e: browser specs on the editor fakes. The production web build runs with
# POTONGIN_EDITOR_V3=on and POTONGIN_EDITOR_FAKES=1 and throwaway credentials; `command` names the
# spec file(s) under web/ (e.g. command='e2e/editor-transition.spec.mjs'), run in Chrome for
# Testing (the parity pin) with axe-core. EDITOR_GATES_OUT and the server log are uploaded.
# suite=player: browser specs of the editor player. The image makes the player fixtures
# (scripts/parity/player_fixtures.py, cases in `cases`) and serves its own app with the parity
# harness; Chrome for Testing (`chrome`: a version or a milestone, default the parity pin) runs
# `npx playwright test <command> --project=desktop-chromium` against it, for example
# -f command=e2e/editor-first-frame.spec.mjs. Results land in the run's artifact.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to test
        required: true
        type: string
      suite:
        description: Which suite to run
        required: true
        default: full
        type: choice
        options: [full, image, command, e2e, player]
      command:
        description: For suite=command, a shell command run from the repo root inside the image; for suite=e2e, the spec file(s) under web/; for suite=player, the Playwright arguments
        required: false
        default: ""
        type: string
      cases:
        description: For suite=player, the player fixture cases to make (comma-separated ids)
        required: false
        default: "cfr_25,cfr_30"
        type: string
      chrome:
        description: For suite=player, the Chrome for Testing version or milestone (empty = the parity pin)
        required: false
        default: ""
        type: string

run-name: "${{ inputs.suite }} @ ${{ inputs.ref }}"

permissions:
  contents: read

jobs:
  gates:
    name: ${{ inputs.suite }} @ ${{ inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GATE_COMMAND: ${{ inputs.command }}
    steps:
      - name: Check out the branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install FFmpeg
        if: inputs.suite == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Set up Python
        if: inputs.suite == 'full'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        if: inputs.suite == 'full'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Python suites
        if: inputs.suite == 'full'
        run: |
          uv sync --frozen --extra vision --extra web
          uv run ruff check src tests
          uv run pytest

      - name: Set up Node.js
        if: ${{ !cancelled() && (inputs.suite == 'full' || inputs.suite == 'e2e' || inputs.suite == 'player') }}
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web suites
        if: ${{ !cancelled() && inputs.suite == 'full' }}
        working-directory: web
        env:
          PYTHON_BIN: ${{ github.workspace }}/.venv/bin/python
        run: |
          npm ci
          npm test
          npm run build

      - name: Web build, Chrome for Testing and axe-core
        if: inputs.suite == 'e2e'
        working-directory: web
        env:
          CHROME_FOR_TESTING: "147.0.7727.15"
          AXE_CORE_VERSION: "4.10.3"
        run: |
          test -n "$GATE_COMMAND" || { echo "suite=e2e needs -f command='<spec file(s) under web/>'"; exit 1; }
          npm ci
          npm run build
          npx playwright install-deps chromium
          # The parity pin is Playwright's chromium build 1217; the specs look for it there.
          target="$HOME/.cache/ms-playwright/chromium-1217"
          mkdir -p "$target"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cft.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_FOR_TESTING/linux64/chrome-linux64.zip"
          unzip -q -o "$RUNNER_TEMP/cft.zip" -d "$target"
          echo "PARITY_CHROME=$target/chrome-linux64/chrome" >> "$GITHUB_ENV"
          version=$(PARITY_CHROME="$target/chrome-linux64/chrome" node -e 'import("@playwright/test").then(async ({ chromium }) => { const b = await chromium.launch({ executablePath: process.env.PARITY_CHROME }); console.log(b.version()); await b.close(); })')
          echo "Chrome for Testing $version"
          test "$version" = "$CHROME_FOR_TESTING"
          # axe-core is not a web dependency: the registry tarball, outside node_modules.
          npm pack "axe-core@$AXE_CORE_VERSION" --pack-destination "$RUNNER_TEMP" > /dev/null
          tar -xzf "$RUNNER_TEMP/axe-core-$AXE_CORE_VERSION.tgz" -C "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/package/axe.min.js"
          echo "AXE_CORE_PATH=$RUNNER_TEMP/package/axe.min.js" >> "$GITHUB_ENV"

      - name: Start the web app on the editor fakes
        if: inputs.suite == 'e2e'
        working-directory: web
        run: |
          user=e2e-fakes
          password=$(openssl rand -hex 24)
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "::add-mask::$secret"
          echo "E2E_USERNAME=$user" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/gate-output" "$RUNNER_TEMP/jobs" "$RUNNER_TEMP/settings"
          # An empty jobs root and settings directory: the project list after login reads them.
          APP_USERNAME="$user" APP_PASSWORD="$password" APP_SESSION_SECRET="$secret" \
            JOBS_ROOT="$RUNNER_TEMP/jobs" POTONGIN_SETTINGS_DIR="$RUNNER_TEMP/settings" \
            POTONGIN_EDITOR_V3=on POTONGIN_EDITOR_FAKES=1 \
            nohup npx next start --hostname 127.0.0.1 --port 3217 > "$GITHUB_WORKSPACE/gate-output/next.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3217/api/health > /dev/null && exit 0
            sleep 2
          done
          tail -n 40 "$GITHUB_WORKSPACE/gate-output/next.log"
          exit 1

      - name: Browser specs on the editor fakes
        if: inputs.suite == 'e2e'
        working-directory: web
        env:
          E2E_BASE_URL: http://127.0.0.1:3217
          E2E_NO_WEB_SERVER: "1"
          E2E_EDITOR_FAKES: "1"
        run: |
          EDITOR_GATES_OUT="$GITHUB_WORKSPACE/gate-output/e2e" npx playwright test $GATE_COMMAND --project=desktop-chromium

      - name: Build the production image
        if: inputs.suite == 'image' || inputs.suite == 'command' || inputs.suite == 'player'
        run: docker build --tag potongin-gates .

      - name: Run inside the production image
        if: inputs.suite == 'image' || inputs.suite == 'command'
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          mkdir -p gate-output && chmod 777 gate-output
          docker run --rm -e SUITE -e GATE_COMMAND -v "$PWD:/w:ro" -v "$PWD/gate-output:/out" potongin-gates sh -ec '
            cp -r /w /tmp/w && cd /tmp/w
            uv sync --frozen --python /usr/bin/python3 --extra vision --extra web
            if [ "$SUITE" = image ]; then uv run pytest; else sh -ec "$GATE_COMMAND"; fi
            if [ -d docs/editor/evidence ]; then cp -r docs/editor/evidence /out/; fi'

      - name: Player fixtures in the image
        if: inputs.suite == 'player'
        env:
          PLAYER_CASES: ${{ inputs.cases }}
        run: |
          mkdir -p gate-output && chmod 777 gate-output
          docker run --rm -e PLAYER_CASES -v "$PWD:/w:ro" -v "$PWD/gate-output:/out" potongin-gates sh -ec '
            cp -r /w /tmp/w && cd /tmp/w
            uv sync --frozen --python /usr/bin/python3 --extra vision --extra web > /out/uv-sync.log 2>&1 || { tail -n 40 /out/uv-sync.log; exit 1; }
            PYTHONPATH=src:tests uv run python scripts/parity/player_fixtures.py generate --out /out/ptxt --only "$PLAYER_CASES"'

      - name: Install Chrome for Testing
        if: inputs.suite == 'player'
        working-directory: web
        env:
          CHROME_REQUEST: ${{ inputs.chrome }}
          CHROME_PIN: "147.0.7727.15"
        run: |
          npm ci
          npx playwright install-deps chromium
          version="${CHROME_REQUEST:-$CHROME_PIN}"
          case "$version" in
            *[!0-9]*) ;;
            *) version=$(curl -fsSL --retry 3 https://googlechromelabs.github.io/chrome-for-testing/latest-versions-per-milestone.json \
                 | python3 -c 'import json, sys; print(json.load(sys.stdin)["milestones"][sys.argv[1]]["version"])' "$version") ;;
          esac
          target="$HOME/.cache/ms-playwright/cft-$version"
          mkdir -p "$target"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cft.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chrome-linux64.zip"
          unzip -q -o "$RUNNER_TEMP/cft.zip" -d "$target"
          echo "PARITY_CHROME=$target/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "Chrome for Testing $version"

      - name: Start the image's app with the player harness
        if: inputs.suite == 'player'
        run: |
          user=gates-ci
          password=$(openssl rand -hex 24)
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "::add-mask::$secret"
          echo "E2E_USERNAME=$user" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          export APP_USERNAME="$user" APP_PASSWORD="$password" APP_SESSION_SECRET="$secret"
          docker run -d --name gates-app -p 127.0.0.1:3217:3217 -e PORT=3217 -e HOSTNAME=0.0.0.0 \
            -e APP_USERNAME -e APP_PASSWORD -e APP_SESSION_SECRET \
            -e POTONGIN_PARITY_HARNESS=1 -e POTONGIN_PARITY_FIXTURES=/fixtures \
            -e JOBS_STORAGE_QUOTA_BYTES=32212254720 -e JOBS_STORAGE_MIN_FREE_BYTES=1073741824 \
            -e JOBS_STORAGE_ACTIVE_RESERVE_BYTES=1073741824 -e JOBS_STORAGE_SCAN_MAX_ENTRIES=200000 \
            -e JOBS_STORAGE_SCAN_MAX_DEPTH=16 -e JOBS_STORAGE_SCAN_DEADLINE_MS=30000 \
            -e JOBS_STORAGE_RECHECK_BYTES=8388608 -e JOBS_STORAGE_RECHECK_INTERVAL_MS=5000 \
            -v "$PWD/gate-output/ptxt:/fixtures:ro" potongin-gates
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3217/api/health >/dev/null && exit 0
            sleep 2
          done
          docker logs gates-app 2>&1 | tail -n 40
          exit 1

      - name: Player browser specs
        if: inputs.suite == 'player'
        working-directory: web
        env:
          E2E_BASE_URL: http://127.0.0.1:3217
          E2E_NO_WEB_SERVER: "1"
          PARITY_PYTHON: python3
        run: |
          export POTONGIN_PARITY_FIXTURES="$GITHUB_WORKSPACE/gate-output/ptxt" PARITY_OUT_DIR="$GITHUB_WORKSPACE/gate-output/browser"
          echo "Chrome: $("$PARITY_CHROME" --version)"
          eval "npx playwright test ${GATE_COMMAND:-e2e/editor-first-frame.spec.mjs} --project=desktop-chromium"

      - name: App log
        if: always() && inputs.suite == 'player'
        run: docker logs gates-app > gate-output/app.log 2>&1 || true

      - name: Upload outputs
        if: always() && (inputs.suite == 'image' || inputs.suite == 'command' || inputs.suite == 'e2e')
        uses: actions/upload-artifact@v4
        with:
          name: gate-output
          path: gate-output
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload player outputs
        if: always() && inputs.suite == 'player'
        uses: actions/upload-artifact@v4
        with:
          name: gate-output
          # The results and logs; the fixtures (plate cells, mixes) stay out.
          path: |
            gate-output
            !gate-output/ptxt
          if-no-files-found: ignore
          retention-days: 7
