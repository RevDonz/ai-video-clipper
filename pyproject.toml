[project]
name = "ai-video-clipper-spike"
version = "0.1.0"
description = "Technical spike: long video to vertical captioned highlights"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1,<2"]
vision = ["opencv-python-headless>=4.10,<5"]
web = ["yt-dlp>=2026.8.19"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
ai-clipper = "ai_clipper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_clipper"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
