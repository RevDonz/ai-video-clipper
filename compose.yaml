services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # deploy/production.sh builds with IMAGE_TAG set to the deployed commit; Pengaturan shows
      # its first seven characters under "Tentang sistem". Any other tag shows as unknown.
      args:
        POTONGIN_APP_COMMIT: ${IMAGE_TAG:-}
    image: ai-video-clipper:${IMAGE_TAG:-latest}
    container_name: ai-video-clipper
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:3000"
    environment:
      JOBS_ROOT: /data/jobs
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-id}
      # Blank = built-in decoding defaults (docs/operations/TRANSCRIPTION.md).
      WHISPER_CONDITION_ON_PREVIOUS_TEXT: ${WHISPER_CONDITION_ON_PREVIOUS_TEXT:-}
      WHISPER_INITIAL_PROMPT: ${WHISPER_INITIAL_PROMPT:-}
      WHISPER_PROMPT_EVERY_WINDOW: ${WHISPER_PROMPT_EVERY_WINDOW:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
      # Size limit of a project's ZIP download ("Unduh semua"); blank = 2 GiB.
      MAX_ZIP_BYTES: ${MAX_ZIP_BYTES:-}
      PRIMARY_MAX_ACTIVE_JOBS: ${PRIMARY_MAX_ACTIVE_JOBS:-4}
      PRIMARY_WORKER_CONCURRENCY: ${PRIMARY_WORKER_CONCURRENCY:-1}
      PRIMARY_MAX_ATTEMPTS: ${PRIMARY_MAX_ATTEMPTS:-3}
      PRIMARY_LEASE_MS: ${PRIMARY_LEASE_MS:-60000}
      JOBS_STORAGE_QUOTA_BYTES: ${JOBS_STORAGE_QUOTA_BYTES:?required}
      JOBS_STORAGE_MIN_FREE_BYTES: ${JOBS_STORAGE_MIN_FREE_BYTES:?required}
      JOBS_STORAGE_ACTIVE_RESERVE_BYTES: ${JOBS_STORAGE_ACTIVE_RESERVE_BYTES:?required}
      JOBS_STORAGE_SCAN_MAX_ENTRIES: ${JOBS_STORAGE_SCAN_MAX_ENTRIES:?required}
      JOBS_STORAGE_SCAN_MAX_DEPTH: ${JOBS_STORAGE_SCAN_MAX_DEPTH:?required}
      JOBS_STORAGE_SCAN_DEADLINE_MS: ${JOBS_STORAGE_SCAN_DEADLINE_MS:?required}
      JOBS_STORAGE_RECHECK_BYTES: ${JOBS_STORAGE_RECHECK_BYTES:?required}
      JOBS_STORAGE_RECHECK_INTERVAL_MS: ${JOBS_STORAGE_RECHECK_INTERVAL_MS:?required}
      APP_USERNAME: ${APP_USERNAME:?APP_USERNAME is required}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD is required}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?APP_SESSION_SECRET is required}
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-8}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_TRUSTED_CLIENT_IP_HEADER: ${AUTH_TRUSTED_CLIENT_IP_HEADER:-}
      # Editor flags, release defaults (docs/editor/OPERASIONAL.md §2): the editor, its logo and
      # music uploads (QG-SEC complete) and its free-LLM hook suggestions (QG-AI hard gates) are
      # on. The auto clips render with the editor's compiler (edit-v2); legacy is the rollback
      # switch. Set any flag in .env (off, or legacy for the engine) without a rebuild.
      POTONGIN_RENDER_ENGINE: ${POTONGIN_RENDER_ENGINE:-edit-v2}
      POTONGIN_EDITOR_V3: ${POTONGIN_EDITOR_V3:-on}
      POTONGIN_EDITOR_UPLOADS: ${POTONGIN_EDITOR_UPLOADS:-on}
      POTONGIN_EDITOR_LLM: ${POTONGIN_EDITOR_LLM:-on}
      POTONGIN_EDITOR_SHELL: ${POTONGIN_EDITOR_SHELL:-legacy}
      # UI languages, comma-separated (web/lib/i18n/locales.mjs); id is always on. Only the app
      # renders UI text: the workers never get this.
      POTONGIN_LOCALES: ${POTONGIN_LOCALES:-id}
      # Optional: the editor's hook suggestions use these free models first (provider/model,
      # comma-separated; K13). Blank = the saved Pengaturan chain.
      POTONGIN_LLM_EDITOR_MODELS: ${POTONGIN_LLM_EDITOR_MODELS:-}
      # The control data (rombak 01 §5): the user database and the settings, on their own volume
      # that the render-worker does not mount. LLM keys are sealed with AES-256-GCM under
      # POTONGIN_SETTINGS_SECRET; the primary-worker must see the same value. To keep the sealed
      # keys readable, copy APP_SESSION_SECRET into it unless .env already sets its own value.
      POTONGIN_DB_PATH: /control/potongin.sqlite
      POTONGIN_SETTINGS_DIR: /control/settings
      POTONGIN_SETTINGS_SECRET: ${POTONGIN_SETTINGS_SECRET:?POTONGIN_SETTINGS_SECRET is required}
      # The deploy's read-only user, made at boot by scripts/start-app.mjs (rombak 02 §6.6).
      E2E_SMOKE_USERNAME: ${E2E_SMOKE_USERNAME:-}
      E2E_SMOKE_PASSWORD: ${E2E_SMOKE_PASSWORD:-}
      # Fallback while no settings file exists, and the source of the one-click
      # "Impor dari konfigurasi server (.env)". Empty means "use the default".
      POTONGIN_LLM: ${POTONGIN_LLM:-}
      POTONGIN_LLM_PROVIDER: ${POTONGIN_LLM_PROVIDER:-}
      POTONGIN_LLM_PROVIDERS: ${POTONGIN_LLM_PROVIDERS:-}
      POTONGIN_LLM_FREE_ONLY: ${POTONGIN_LLM_FREE_ONLY:-}
      POTONGIN_LLM_MODEL: ${POTONGIN_LLM_MODEL:-}
      POTONGIN_LLM_FALLBACK_MODELS: ${POTONGIN_LLM_FALLBACK_MODELS:-}
      POTONGIN_LLM_BASE_URL: ${POTONGIN_LLM_BASE_URL:-}
      POTONGIN_LLM_TIMEOUT: ${POTONGIN_LLM_TIMEOUT:-}
      POTONGIN_LLM_RPM: ${POTONGIN_LLM_RPM:-}
      POTONGIN_LLM_CONTEXT_TOKENS: ${POTONGIN_LLM_CONTEXT_TOKENS:-}
      POTONGIN_LLM_MAX_OUTPUT_TOKENS: ${POTONGIN_LLM_MAX_OUTPUT_TOKENS:-}
      POTONGIN_LLM_REASONING_EFFORT: ${POTONGIN_LLM_REASONING_EFFORT:-}
      POTONGIN_LLM_CUSTOM_BASE_URL: ${POTONGIN_LLM_CUSTOM_BASE_URL:-}
      POTONGIN_LLM_CUSTOM_API_KEY: ${POTONGIN_LLM_CUSTOM_API_KEY:-}
      POTONGIN_LLM_CUSTOM_MODEL: ${POTONGIN_LLM_CUSTOM_MODEL:-}
      POTONGIN_LLM_CUSTOM_REASONING_EFFORT: ${POTONGIN_LLM_CUSTOM_REASONING_EFFORT:-}
      POTONGIN_LLM_CUSTOM_CONTEXT_TOKENS: ${POTONGIN_LLM_CUSTOM_CONTEXT_TOKENS:-}
      POTONGIN_LLM_CUSTOM_MAX_OUTPUT_TOKENS: ${POTONGIN_LLM_CUSTOM_MAX_OUTPUT_TOKENS:-}
      POTONGIN_LLM_CUSTOM_TIMEOUT: ${POTONGIN_LLM_CUSTOM_TIMEOUT:-}
      POTONGIN_LLM_CUSTOM_NAME: ${POTONGIN_LLM_CUSTOM_NAME:-}
      POTONGIN_LLM_CUSTOM_FALLBACK_MODELS: ${POTONGIN_LLM_CUSTOM_FALLBACK_MODELS:-}
      # Up to two more OpenAI-compatible servers (e.g. a 9Router gateway on the
      # Docker host: http://host.docker.internal:20128/v1), same suffixes.
      POTONGIN_LLM_CUSTOM2_NAME: ${POTONGIN_LLM_CUSTOM2_NAME:-}
      POTONGIN_LLM_CUSTOM2_BASE_URL: ${POTONGIN_LLM_CUSTOM2_BASE_URL:-}
      POTONGIN_LLM_CUSTOM2_API_KEY: ${POTONGIN_LLM_CUSTOM2_API_KEY:-}
      POTONGIN_LLM_CUSTOM2_MODEL: ${POTONGIN_LLM_CUSTOM2_MODEL:-}
      POTONGIN_LLM_CUSTOM2_FALLBACK_MODELS: ${POTONGIN_LLM_CUSTOM2_FALLBACK_MODELS:-}
      POTONGIN_LLM_CUSTOM2_REASONING_EFFORT: ${POTONGIN_LLM_CUSTOM2_REASONING_EFFORT:-}
      POTONGIN_LLM_CUSTOM2_CONTEXT_TOKENS: ${POTONGIN_LLM_CUSTOM2_CONTEXT_TOKENS:-}
      POTONGIN_LLM_CUSTOM2_MAX_OUTPUT_TOKENS: ${POTONGIN_LLM_CUSTOM2_MAX_OUTPUT_TOKENS:-}
      POTONGIN_LLM_CUSTOM2_TIMEOUT: ${POTONGIN_LLM_CUSTOM2_TIMEOUT:-}
      POTONGIN_LLM_CUSTOM3_NAME: ${POTONGIN_LLM_CUSTOM3_NAME:-}
      POTONGIN_LLM_CUSTOM3_BASE_URL: ${POTONGIN_LLM_CUSTOM3_BASE_URL:-}
      POTONGIN_LLM_CUSTOM3_API_KEY: ${POTONGIN_LLM_CUSTOM3_API_KEY:-}
      POTONGIN_LLM_CUSTOM3_MODEL: ${POTONGIN_LLM_CUSTOM3_MODEL:-}
      POTONGIN_LLM_CUSTOM3_FALLBACK_MODELS: ${POTONGIN_LLM_CUSTOM3_FALLBACK_MODELS:-}
      POTONGIN_LLM_CUSTOM3_REASONING_EFFORT: ${POTONGIN_LLM_CUSTOM3_REASONING_EFFORT:-}
      POTONGIN_LLM_CUSTOM3_CONTEXT_TOKENS: ${POTONGIN_LLM_CUSTOM3_CONTEXT_TOKENS:-}
      POTONGIN_LLM_CUSTOM3_MAX_OUTPUT_TOKENS: ${POTONGIN_LLM_CUSTOM3_MAX_OUTPUT_TOKENS:-}
      POTONGIN_LLM_CUSTOM3_TIMEOUT: ${POTONGIN_LLM_CUSTOM3_TIMEOUT:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Lets the engine (and the model list on /settings) reach an LLM server or
    # gateway running on the Docker host, e.g. http://host.docker.internal:20128/v1.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - clipper_data:/data
      - potongin_control:/control
    init: true
    mem_limit: 10g
    cpus: 6
    pids_limit: 512
    stop_grace_period: 30s

  primary-worker:
    image: ai-video-clipper:${IMAGE_TAG:-latest}
    container_name: ai-video-clipper-primary-worker
    restart: unless-stopped
    command:
      - node
      - scripts/primary-worker.mjs
    environment:
      JOBS_ROOT: /data/jobs
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-id}
      # Blank = built-in decoding defaults (docs/operations/TRANSCRIPTION.md).
      WHISPER_CONDITION_ON_PREVIOUS_TEXT: ${WHISPER_CONDITION_ON_PREVIOUS_TEXT:-}
      WHISPER_INITIAL_PROMPT: ${WHISPER_INITIAL_PROMPT:-}
      WHISPER_PROMPT_EVERY_WINDOW: ${WHISPER_PROMPT_EVERY_WINDOW:-}
      PRIMARY_MAX_ACTIVE_JOBS: ${PRIMARY_MAX_ACTIVE_JOBS:-4}
      PRIMARY_WORKER_CONCURRENCY: ${PRIMARY_WORKER_CONCURRENCY:-1}
      PRIMARY_MAX_ATTEMPTS: ${PRIMARY_MAX_ATTEMPTS:-3}
      PRIMARY_LEASE_MS: ${PRIMARY_LEASE_MS:-60000}
      JOBS_STORAGE_QUOTA_BYTES: ${JOBS_STORAGE_QUOTA_BYTES:?required}
      JOBS_STORAGE_MIN_FREE_BYTES: ${JOBS_STORAGE_MIN_FREE_BYTES:?required}
      JOBS_STORAGE_ACTIVE_RESERVE_BYTES: ${JOBS_STORAGE_ACTIVE_RESERVE_BYTES:?required}
      JOBS_STORAGE_SCAN_MAX_ENTRIES: ${JOBS_STORAGE_SCAN_MAX_ENTRIES:?required}
      JOBS_STORAGE_SCAN_MAX_DEPTH: ${JOBS_STORAGE_SCAN_MAX_DEPTH:?required}
      JOBS_STORAGE_SCAN_DEADLINE_MS: ${JOBS_STORAGE_SCAN_DEADLINE_MS:?required}
      JOBS_STORAGE_RECHECK_BYTES: ${JOBS_STORAGE_RECHECK_BYTES:?required}
      JOBS_STORAGE_RECHECK_INTERVAL_MS: ${JOBS_STORAGE_RECHECK_INTERVAL_MS:?required}
      PRIMARY_LEGACY_QUIESCENCE_MS: ${PRIMARY_LEGACY_QUIESCENCE_MS:-300000}
      PRIMARY_WORKER_POLL_MS: ${PRIMARY_WORKER_POLL_MS:-2000}
      PRIMARY_WORKER_HEALTH_PATH: /tmp/primary-worker-health.json
      PRIMARY_WORKER_HEALTH_MAX_AGE_MS: ${PRIMARY_WORKER_HEALTH_MAX_AGE_MS:-15000}
      POTONGIN_CAPTIONS_TIMEOUT_MS: ${POTONGIN_CAPTIONS_TIMEOUT_MS:-}
      # Blank = 120 s without download progress stops yt-dlp (docs/operations/UNDUHAN_YOUTUBE.md).
      POTONGIN_DOWNLOAD_STALL_MS: ${POTONGIN_DOWNLOAD_STALL_MS:-}
      # Which engine renders the auto clips: edit-v2 (the editor's compiler, release default) or
      # legacy (the rollback switch).
      POTONGIN_RENDER_ENGINE: ${POTONGIN_RENDER_ENGINE:-edit-v2}
      # Silent pauses in the auto clips shrink to 0.2 s (on, release default); off is the
      # rollback switch (docs/editor/OPERASIONAL.md §2).
      POTONGIN_AUTO_PAUSE_TRIM: ${POTONGIN_AUTO_PAUSE_TRIM:-on}
      # LLM settings saved on the Pengaturan page (docs/operations/LLM_PROVIDERS.md):
      # run-job.mjs opens the sealed keys with the same secret as the app and hands
      # them only to the engine process; yt-dlp never receives keys or secrets.
      POTONGIN_DB_PATH: /control/potongin.sqlite
      POTONGIN_SETTINGS_DIR: /control/settings
      POTONGIN_SETTINGS_SECRET: ${POTONGIN_SETTINGS_SECRET:?POTONGIN_SETTINGS_SECRET is required}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?APP_SESSION_SECRET is required}
      # Fallback while no settings file exists (ignored once settings are saved).
      POTONGIN_LLM: ${POTONGIN_LLM:-}
      POTONGIN_LLM_PROVIDER: ${POTONGIN_LLM_PROVIDER:-}
      POTONGIN_LLM_PROVIDERS: ${POTONGIN_LLM_PROVIDERS:-}
      POTONGIN_LLM_FREE_ONLY: ${POTONGIN_LLM_FREE_ONLY:-}
      POTONGIN_LLM_MODEL: ${POTONGIN_LLM_MODEL:-}
      POTONGIN_LLM_FALLBACK_MODELS: ${POTONGIN_LLM_FALLBACK_MODELS:-}
      POTONGIN_LLM_BASE_URL: ${POTONGIN_LLM_BASE_URL:-}
      POTONGIN_LLM_TIMEOUT: ${POTONGIN_LLM_TIMEOUT:-}
      POTONGIN_LLM_RPM: ${POTONGIN_LLM_RPM:-}
      POTONGIN_LLM_CONTEXT_TOKENS: ${POTONGIN_LLM_CONTEXT_TOKENS:-}
      POTONGIN_LLM_MAX_OUTPUT_TOKENS: ${POTONGIN_LLM_MAX_OUTPUT_TOKENS:-}
      POTONGIN_LLM_REASONING_EFFORT: ${POTONGIN_LLM_REASONING_EFFORT:-}
      POTONGIN_LLM_CUSTOM_BASE_URL: ${POTONGIN_LLM_CUSTOM_BASE_URL:-}
      POTONGIN_LLM_CUSTOM_API_KEY: ${POTONGIN_LLM_CUSTOM_API_KEY:-}
      POTONGIN_LLM_CUSTOM_MODEL: ${POTONGIN_LLM_CUSTOM_MODEL:-}
      POTONGIN_LLM_CUSTOM_REASONING_EFFORT: ${POTONGIN_LLM_CUSTOM_REASONING_EFFORT:-}
      POTONGIN_LLM_CUSTOM_CONTEXT_TOKENS: ${POTONGIN_LLM_CUSTOM_CONTEXT_TOKENS:-}
      POTONGIN_LLM_CUSTOM_MAX_OUTPUT_TOKENS: ${POTONGIN_LLM_CUSTOM_MAX_OUTPUT_TOKENS:-}
      POTONGIN_LLM_CUSTOM_TIMEOUT: ${POTONGIN_LLM_CUSTOM_TIMEOUT:-}
      POTONGIN_LLM_CUSTOM_NAME: ${POTONGIN_LLM_CUSTOM_NAME:-}
      POTONGIN_LLM_CUSTOM_FALLBACK_MODELS: ${POTONGIN_LLM_CUSTOM_FALLBACK_MODELS:-}
      # Up to two more OpenAI-compatible servers (e.g. a 9Router gateway on the
      # Docker host: http://host.docker.internal:20128/v1), same suffixes.
      POTONGIN_LLM_CUSTOM2_NAME: ${POTONGIN_LLM_CUSTOM2_NAME:-}
      POTONGIN_LLM_CUSTOM2_BASE_URL: ${POTONGIN_LLM_CUSTOM2_BASE_URL:-}
      POTONGIN_LLM_CUSTOM2_API_KEY: ${POTONGIN_LLM_CUSTOM2_API_KEY:-}
      POTONGIN_LLM_CUSTOM2_MODEL: ${POTONGIN_LLM_CUSTOM2_MODEL:-}
      POTONGIN_LLM_CUSTOM2_FALLBACK_MODELS: ${POTONGIN_LLM_CUSTOM2_FALLBACK_MODELS:-}
      POTONGIN_LLM_CUSTOM2_REASONING_EFFORT: ${POTONGIN_LLM_CUSTOM2_REASONING_EFFORT:-}
      POTONGIN_LLM_CUSTOM2_CONTEXT_TOKENS: ${POTONGIN_LLM_CUSTOM2_CONTEXT_TOKENS:-}
      POTONGIN_LLM_CUSTOM2_MAX_OUTPUT_TOKENS: ${POTONGIN_LLM_CUSTOM2_MAX_OUTPUT_TOKENS:-}
      POTONGIN_LLM_CUSTOM2_TIMEOUT: ${POTONGIN_LLM_CUSTOM2_TIMEOUT:-}
      POTONGIN_LLM_CUSTOM3_NAME: ${POTONGIN_LLM_CUSTOM3_NAME:-}
      POTONGIN_LLM_CUSTOM3_BASE_URL: ${POTONGIN_LLM_CUSTOM3_BASE_URL:-}
      POTONGIN_LLM_CUSTOM3_API_KEY: ${POTONGIN_LLM_CUSTOM3_API_KEY:-}
      POTONGIN_LLM_CUSTOM3_MODEL: ${POTONGIN_LLM_CUSTOM3_MODEL:-}
      POTONGIN_LLM_CUSTOM3_FALLBACK_MODELS: ${POTONGIN_LLM_CUSTOM3_FALLBACK_MODELS:-}
      POTONGIN_LLM_CUSTOM3_REASONING_EFFORT: ${POTONGIN_LLM_CUSTOM3_REASONING_EFFORT:-}
      POTONGIN_LLM_CUSTOM3_CONTEXT_TOKENS: ${POTONGIN_LLM_CUSTOM3_CONTEXT_TOKENS:-}
      POTONGIN_LLM_CUSTOM3_MAX_OUTPUT_TOKENS: ${POTONGIN_LLM_CUSTOM3_MAX_OUTPUT_TOKENS:-}
      POTONGIN_LLM_CUSTOM3_TIMEOUT: ${POTONGIN_LLM_CUSTOM3_TIMEOUT:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Lets the engine (and the model list on /settings) reach an LLM server or
    # gateway running on the Docker host, e.g. http://host.docker.internal:20128/v1.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - clipper_data:/data
      - potongin_control:/control
    init: true
    mem_limit: 10g
    cpus: 6
    pids_limit: 512
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "scripts/check-primary-worker-health.mjs"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Longer than the 60 s the worker waits for the app's migration (rombak 01 §2.4).
      start_period: 70s

  render-worker:
    image: ai-video-clipper:${IMAGE_TAG:-latest}
    container_name: ai-video-clipper-render-worker
    restart: unless-stopped
    command:
      - python
      - -m
      - ai_clipper.render_worker
      - --jobs-root
      - /data/jobs
      - --watch
      - --poll-seconds
      - "2"
    environment:
      JOBS_ROOT: /data/jobs
      RENDER_STORAGE_CLI: /app/scripts/render-storage-admission.mjs
      POTONGIN_RENDER_ENGINE: ${POTONGIN_RENDER_ENGINE:-edit-v2}
      JOBS_STORAGE_QUOTA_BYTES: ${JOBS_STORAGE_QUOTA_BYTES:?required}
      JOBS_STORAGE_MIN_FREE_BYTES: ${JOBS_STORAGE_MIN_FREE_BYTES:?required}
      JOBS_STORAGE_ACTIVE_RESERVE_BYTES: ${JOBS_STORAGE_ACTIVE_RESERVE_BYTES:?required}
      JOBS_STORAGE_SCAN_MAX_ENTRIES: ${JOBS_STORAGE_SCAN_MAX_ENTRIES:?required}
      JOBS_STORAGE_SCAN_MAX_DEPTH: ${JOBS_STORAGE_SCAN_MAX_DEPTH:?required}
      JOBS_STORAGE_SCAN_DEADLINE_MS: ${JOBS_STORAGE_SCAN_DEADLINE_MS:?required}
      JOBS_STORAGE_RECHECK_BYTES: ${JOBS_STORAGE_RECHECK_BYTES:?required}
      JOBS_STORAGE_RECHECK_INTERVAL_MS: ${JOBS_STORAGE_RECHECK_INTERVAL_MS:?required}
    # Never potongin_control: this service must not be able to open the DB or the sealed settings.
    volumes:
      - clipper_data:/data
    init: true
    mem_limit: 6g
    cpus: 4
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      disable: true

volumes:
  clipper_data:
  potongin_control:
