<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Editor V3 font lockdown (plan §5.2 R6). FFmpeg's `ass` filter runs with
  FONTCONFIG_FILE pointing here, so fontconfig replaces the system configuration and
  sees only the pinned files in resources/fonts (listed in resources/fonts/fonts.json).

  DejaVu Sans is the only fallback. fontconfig accepts the DejaVu Sans family and
  rejects every other file, so libass' fallback search (FcFontSort on "sans-serif")
  can only ever return DejaVu Sans, whatever the other fonts cover. The pack fonts
  (Montserrat ExtraBold) still reach libass as primary fonts through the filter's
  `fontsdir=` option (libass' embedded-font provider), never through fontconfig.
  JASSUB in the browser uses the same files and `fallbackFont` DejaVu Sans.
-->
<fontconfig>
  <!-- ../fonts relative to this file: /app/resources/fonts in the image. -->
  <dir prefix="relative">../fonts</dir>

  <!-- Accepted patterns win over rejected ones; the empty pattern matches every font.
       (Pattern rules, not file-name globs: the local fontconfig 2.15 was seen to skip
       glob rules depending on the working directory.) -->
  <selectfont>
    <acceptfont>
      <pattern>
        <patelt name="family"><string>DejaVu Sans</string></patelt>
      </pattern>
    </acceptfont>
    <rejectfont>
      <pattern></pattern>
    </rejectfont>
  </selectfont>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
